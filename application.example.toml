[server]
ip = "127.0.0.1"
port = 8000
debug = false
password = "change-me-before-exposing"

[limits]
max_sessions = 10
max_text_length = 500

[plugins]
voicevox = { enabled = true, base_url = "http://127.0.0.1:50021" }
kokoro_82m = { enabled = false, base_url = "http://127.0.0.1:50101" }
aitalked = { enabled = false, base_url = "http://127.0.0.1:3000", timeout = 30 }
coeiroink = { enabled = false, speaker_info_dir = "speaker_info", device = "auto", max_loaded_models = 1 }

[plugins.runtime]
voicevox = "python"
kokoro_82m = "python"
aitalked = "python"
coeiroink = "torch-auto"
